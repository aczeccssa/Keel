<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keel AI Relay — Customer Portal</title>
    <link rel="shortcut icon" href="/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="/api/plugins/customer-portal/ui/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
        (function(){
            var stored = localStorage.getItem('keel-theme-pref');
            var dark;
            if (stored === 'dark') dark = true;
            else if (stored === 'light') dark = false;
            else dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <script type="module" src="/api/plugins/customer-portal/ui/js/app.js"></script>
</head>
<body>
    <customer-app></customer-app>
</body>
</html>
